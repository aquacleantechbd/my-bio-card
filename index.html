<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#eff6ff">
  <meta name="description" content="Personal bio card for Abu Sayed, Student & Entrepreneur.">
  <title>Abu Sayed | Personal Bio</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #eff6ff;
      color: #12233f;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    * {
      box-sizing: border-box;
    }

    body {
      display: grid;
      min-height: 100vh;
      margin: 0;
      padding: 24px;
      place-items: center;
      background:
        radial-gradient(ellipse at 12% 18%, rgb(96 165 250 / 18%), transparent 34%),
        radial-gradient(ellipse at 90% 86%, rgb(37 99 235 / 12%), transparent 30%),
        #eff6ff;
    }

    .card {
      width: min(100%, 390px);
      overflow: hidden;
      border: 1px solid rgb(219 234 254 / 90%);
      border-radius: 28px;
      background: #fff;
      box-shadow: 0 24px 70px rgb(30 64 175 / 14%);
      text-align: center;
    }

    .card-banner {
      position: relative;
      height: 150px;
      background: linear-gradient(135deg, #2563eb, #60a5fa);
    }

    .card-banner::before,
    .card-banner::after {
      position: absolute;
      border: 1px solid rgb(255 255 255 / 24%);
      border-radius: 50%;
      content: "";
    }

    .card-banner::before {
      top: -88px;
      right: -40px;
      width: 230px;
      height: 230px;
    }

    .card-banner::after {
      right: 46px;
      bottom: -96px;
      width: 190px;
      height: 190px;
    }

    .avatar {
      position: relative;
      display: grid;
      width: 112px;
      height: 112px;
      margin: -56px auto 20px;
      place-items: center;
      border: 6px solid #fff;
      border-radius: 50%;
      background: #dbeafe;
      color: #1d4ed8;
      font-size: 34px;
      font-weight: 750;
      letter-spacing: -2px;
      box-shadow: 0 8px 24px rgb(30 64 175 / 14%);
    }

    .content {
      padding: 0 32px 34px;
    }

    h1 {
      margin: 0;
      color: #10254a;
      font-size: 29px;
      font-weight: 750;
      letter-spacing: -1px;
    }

    .title {
      margin: 8px 0 27px;
      color: #64748b;
      font-size: 15px;
      font-weight: 500;
    }

    .social-links {
      display: grid;
      gap: 12px;
    }

    .button {
      display: flex;
      min-height: 52px;
      align-items: center;
      justify-content: center;
      gap: 10px;
      border: 1px solid transparent;
      border-radius: 14px;
      color: #fff;
      font-size: 15px;
      font-weight: 650;
      text-decoration: none;
      transition: transform 160ms ease, box-shadow 160ms ease, background 160ms ease;
    }

    .button:hover {
      transform: translateY(-2px);
    }

    .button:focus-visible {
      outline: 3px solid #93c5fd;
      outline-offset: 3px;
    }

    .button svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }

    .whatsapp {
      background: #2563eb;
      box-shadow: 0 8px 18px rgb(37 99 235 / 20%);
    }

    .whatsapp:hover {
      background: #1d4ed8;
      box-shadow: 0 11px 22px rgb(37 99 235 / 27%);
    }

    .facebook {
      border-color: #dbeafe;
      background: #fff;
      color: #1d4ed8;
    }

    .facebook:hover {
      background: #eff6ff;
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="card" aria-labelledby="name">
    <div class="card-banner" aria-hidden="true"></div>
    <div class="avatar" aria-hidden="true">AS</div>
    <section class="content">
      <h1 id="name">Abu Sayed</h1>
      <p class="title">Student &amp; Entrepreneur</p>
      <nav class="social-links" aria-label="Social profiles">
        <a class="button whatsapp" href="https://wa.me/?text=Hello%20Abu%20Sayed" target="_blank" rel="noopener noreferrer">

          WhatsApp
        </a>
        <a class="button facebook" href="https://www.facebook.com/" target="_blank" rel="noopener noreferrer">

          Facebook
        </a>
      </nav>
    </section>
  </main>
</body>
</html>
